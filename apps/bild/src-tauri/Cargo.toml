[package]
name = "fernwork-bildeditor"
version = "0.1.0"
description = "Native shell for Fernwork Bildeditor"
authors = ["Fernwork"]
edition = "2021"
license = "MIT"

[lib]
name = "fernwork_bildeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
measurement = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Screen eyedropper (ScreenColorHost): libX11 is opened at run time, so Wayland-only systems still start.
x11-dl = "2.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
