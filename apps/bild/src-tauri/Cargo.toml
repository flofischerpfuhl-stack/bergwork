[package]
name = "fernwork-bildeditor"
version = "0.1.0"
description = "Native shell for Fernwork Bildeditor"
authors = ["Fernwork"]
edition = "2021"
license = "MIT"

[lib]
name = "fernwork_bildeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
a6-spike = ["tauri/unstable", "dep:serde_json", "dep:webkit2gtk", "dep:wgpu", "dep:zune-jpeg"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
zune-jpeg = { version = "0.5.15", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", optional = true }
