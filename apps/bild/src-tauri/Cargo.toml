[package]
name = "fernwork-bildeditor"
version = "0.1.0"
description = "Native shell for Fernwork Bildeditor"
authors = ["Fernwork"]
edition = "2021"
license = "MIT"

[lib]
name = "fernwork_bildeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
